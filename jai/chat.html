<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAI — Tu Segundo Cerebro</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #050508;
  color: #f0f0f8;
  font-family: -apple-system, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: #0d0d12;
  border-bottom: 1px solid #1a1a24;
}
.logo { font-size: 18px; font-weight: 700; color: #f0b429; letter-spacing: .1em; }
.logo span { color: #fff; }
.status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #6b7280; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #00c896; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* MAIN */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* AVATAR SIDE */
.avatar-side {
  width: 340px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(160deg, #0d0d18 0%, #0a0a14 100%);
  border-right: 1px solid #1a1a24;
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.avatar-bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 60%, rgba(88,28,220,0.15) 0%, transparent 70%);
}
.avatar-wrap {
  position: relative;
  z-index: 1;
  width: 220px;
  height: 320px;
}

/* AVATAR SVG ILLUSTRATION - Jorge style */
.avatar-svg {
  width: 100%;
  height: 100%;
}

/* SPEECH BUBBLE */
.speech-bubble {
  position: relative;
  z-index: 2;
  background: #13131a;
  border: 1px solid #2a2a3a;
  border-radius: 16px;
  padding: 12px 16px;
  margin-top: 16px;
  max-width: 280px;
  font-size: 13px;
  color: #f0b429;
  line-height: 1.5;
  min-height: 50px;
  text-align: center;
  transition: all 0.3s ease;
}
.speech-bubble::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-bottom-color: #2a2a3a;
}
.typing-dots {
  display: flex;
  gap: 4px;
  justify-content: center;
  align-items: center;
  height: 20px;
}
.typing-dots span {
  width: 6px; height: 6px;
  background: #f0b429;
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }

/* NAME */
.avatar-name {
  position: relative;
  z-index: 2;
  margin-top: 8px;
  font-size: 11px;
  color: #6b7280;
  letter-spacing: .1em;
  text-transform: uppercase;
}

/* CHAT SIDE */
.chat-side {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* MESSAGES */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }

.msg {
  display: flex;
  gap: 10px;
  max-width: 80%;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.jai { align-self: flex-start; }

.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.msg.user .msg-avatar { background: #1a1a2e; border: 1px solid #3a3a5a; }
.msg.jai .msg-avatar { background: #13130a; border: 1px solid #f0b429; color: #f0b429; font-weight: 700; font-size: 11px; }

.msg-bubble {
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.5;
}
.msg.user .msg-bubble {
  background: #1a1a2e;
  border: 1px solid #2a2a4a;
  color: #c0c0d8;
  border-radius: 16px 4px 16px 16px;
}
.msg.jai .msg-bubble {
  background: #13130a;
  border: 1px solid rgba(240,180,41,0.3);
  color: #f0b429;
  border-radius: 4px 16px 16px 16px;
}

/* INPUT */
.input-area {
  padding: 16px 20px;
  background: #0d0d12;
  border-top: 1px solid #1a1a24;
  display: flex;
  gap: 10px;
  align-items: center;
}
.input-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  background: #13131a;
  border: 1px solid #2a2a3a;
  border-radius: 24px;
  padding: 8px 16px;
  gap: 8px;
  transition: border-color .2s;
}
.input-wrap:focus-within { border-color: #f0b429; }
.input-wrap input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #f0f0f8;
  font-size: 14px;
}
.input-wrap input::placeholder { color: #4b5563; }

/* BUTTONS */
.btn-mic {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: #13131a;
  border: 1px solid #2a2a3a;
  color: #6b7280;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
  flex-shrink: 0;
}
.btn-mic:hover { border-color: #f0b429; color: #f0b429; }
.btn-mic.recording { background: rgba(255,71,87,.15); border-color: #ff4757; color: #ff4757; animation: pulse 1s infinite; }

.btn-send {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: #f0b429;
  border: none;
  color: #050508;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
  flex-shrink: 0;
}
.btn-send:hover { background: #ffd060; transform: scale(1.05); }

/* WAVE */
.wave-wrap {
  display: none;
  align-items: center;
  gap: 3px;
  height: 20px;
}
.wave-wrap.active { display: flex; }
.wave-bar {
  width: 3px;
  background: #ff4757;
  border-radius: 2px;
  animation: wave 1s infinite ease-in-out;
}
.wave-bar:nth-child(2) { animation-delay: .1s; }
.wave-bar:nth-child(3) { animation-delay: .2s; }
.wave-bar:nth-child(4) { animation-delay: .3s; }
.wave-bar:nth-child(5) { animation-delay: .4s; }
@keyframes wave { 0%,100%{height:4px} 50%{height:20px} }
</style>
</head>
<body>

<div class="header">
  <div class="logo">JAI<span> — Tu Segundo Cerebro</span></div>
  <div class="status">
    <div class="status-dot"></div>
    <span id="status-text">En línea · llama3.2:3b</span>
  </div>
</div>

<div class="main">

  <!-- AVATAR -->
  <div class="avatar-side">
    <div class="avatar-bg"></div>

    <div class="avatar-wrap">
      <!-- Avatar SVG estilo ilustración - Jorge -->
      <svg class="avatar-svg" viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg">
        <!-- BG glow -->
        <defs>
          <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#5b2dd4" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="skin" cx="50%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#d4956a"/>
            <stop offset="100%" stop-color="#b87a50"/>
          </radialGradient>
        </defs>
        <ellipse cx="110" cy="200" rx="100" ry="120" fill="url(#bg-glow)"/>

        <!-- SHOES -->
        <ellipse cx="80" cy="305" rx="30" ry="10" fill="#111"/>
        <ellipse cx="145" cy="305" rx="30" ry="10" fill="#111"/>
        <rect x="55" y="290" width="52" height="18" rx="6" fill="#1a1a1a"/>
        <rect x="118" y="290" width="52" height="18" rx="6" fill="#1a1a1a"/>
        <!-- white sole -->
        <rect x="55" y="300" width="52" height="8" rx="4" fill="#e0e0e0"/>
        <rect x="118" y="300" width="52" height="8" rx="4" fill="#e0e0e0"/>

        <!-- LEGS -->
        <rect x="70" y="220" width="35" height="75" rx="8" fill="#111"/>
        <rect x="118" y="220" width="35" height="75" rx="8" fill="#111"/>

        <!-- SHORTS -->
        <rect x="62" y="190" width="100" height="50" rx="10" fill="#0a0a0a"/>
        <!-- Nike logo on shorts -->
        <path d="M100 210 Q115 205 125 212" stroke="#222" stroke-width="2" fill="none"/>

        <!-- BODY - tank top -->
        <rect x="65" y="130" width="95" height="70" rx="10" fill="#111"/>
        <!-- tank straps -->
        <rect x="75" y="110" width="20" height="30" rx="5" fill="#111"/>
        <rect x="130" y="110" width="20" height="30" rx="5" fill="#111"/>

        <!-- ARMS -->
        <!-- left arm -->
        <rect x="40" y="130" width="28" height="80" rx="14" fill="url(#skin)"/>
        <!-- tattoo on left arm -->
        <text x="44" y="185" font-size="7" fill="#8a6a50" font-family="serif">3:33</text>
        <!-- right arm -->
        <rect x="155" y="130" width="28" height="80" rx="14" fill="url(#skin)"/>
        <!-- bracelet left -->
        <rect x="40" y="195" width="28" height="5" rx="2" fill="#c8a96e"/>
        <!-- bracelet right -->
        <rect x="155" y="195" width="28" height="5" rx="2" fill="#333"/>

        <!-- NECK -->
        <rect x="98" y="100" width="28" height="22" rx="6" fill="url(#skin)"/>

        <!-- HEAD -->
        <ellipse cx="112" cy="85" rx="42" ry="46" fill="url(#skin)"/>

        <!-- CAP -->
        <ellipse cx="112" cy="55" rx="46" ry="14" fill="#333"/>
        <rect x="66" y="44" width="92" height="18" rx="6" fill="#2a2a2a"/>
        <!-- cap brim -->
        <ellipse cx="112" cy="62" rx="50" ry="8" fill="#222"/>
        <!-- cap button -->
        <circle cx="112" cy="44" r="4" fill="#444"/>
        <!-- cap strap -->
        <rect x="96" y="55" width="32" height="5" rx="2" fill="#1a1a1a"/>

        <!-- FACE -->
        <!-- SUNGLASSES -->
        <rect x="80" y="76" width="30" height="18" rx="8" fill="#111" opacity="0.95"/>
        <rect x="114" y="76" width="30" height="18" rx="8" fill="#111" opacity="0.95"/>
        <!-- bridge -->
        <line x1="110" y1="85" x2="114" y2="85" stroke="#555" stroke-width="2"/>
        <!-- arms -->
        <line x1="80" y1="85" x2="70" y2="83" stroke="#555" stroke-width="2"/>
        <line x1="144" y1="85" x2="154" y2="83" stroke="#555" stroke-width="2"/>
        <!-- lens shine -->
        <ellipse cx="88" cy="81" rx="5" ry="3" fill="#222" opacity="0.5"/>
        <ellipse cx="122" cy="81" rx="5" ry="3" fill="#222" opacity="0.5"/>

        <!-- NOSE -->
        <path d="M108 95 Q112 103 116 95" stroke="#a06840" stroke-width="1.5" fill="none"/>

        <!-- MOUTH - animated -->
        <g id="mouth">
          <path id="mouth-closed" d="M100 108 Q112 114 124 108" stroke="#8a5030" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path id="mouth-open" d="M100 108 Q112 118 124 108" stroke="#8a5030" stroke-width="2" fill="#5a2010" stroke-linecap="round" visibility="hidden"/>
        </g>

        <!-- BEARD/STUBBLE -->
        <ellipse cx="112" cy="112" rx="22" ry="8" fill="#6a4030" opacity="0.4"/>

        <!-- EARS -->
        <ellipse cx="70" cy="88" rx="8" ry="11" fill="url(#skin)"/>
        <ellipse cx="154" cy="88" rx="8" ry="11" fill="url(#skin)"/>

        <!-- Neon accent lines (style) -->
        <line x1="20" y1="50" x2="60" y2="150" stroke="#00c896" stroke-width="1" opacity="0.2"/>
        <line x1="200" y1="50" x2="160" y2="150" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
      </svg>
    </div>

    <div class="speech-bubble" id="bubble">
      <span id="bubble-text">Hola Jorge, ¿en qué te puedo ayudar?</span>
    </div>
    <div class="avatar-name">JAI · Asistente Personal</div>
  </div>

  <!-- CHAT -->
  <div class="chat-side">
    <div class="messages" id="messages">
      <div class="msg jai">
        <div class="msg-avatar">JAI</div>
        <div class="msg-bubble">Hola Jorge 👋 Soy JAI, tu segundo cerebro. Puedes escribirme o usar el micrófono para hablar. ¿En qué te ayudo hoy?</div>
      </div>
    </div>

    <div class="input-area">
      <button class="btn-mic" id="btn-mic" onclick="toggleMic()" title="Mantén presionado para hablar">🎤</button>
      <div class="input-wrap">
        <div class="wave-wrap" id="wave">
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <input type="text" id="input" placeholder="Escribe tu mensaje..." onkeydown="if(event.key==='Enter')sendMsg()"/>
      </div>
      <button class="btn-send" onclick="sendMsg()" title="Enviar">➤</button>
    </div>
  </div>

</div>

<script>
const API = 'http://127.0.0.1:5000';
let isSpeaking = false;
let isRecording = false;

// ── MOUTH ANIMATION ──
function openMouth() {
  document.getElementById('mouth-closed').setAttribute('visibility','hidden');
  document.getElementById('mouth-open').setAttribute('visibility','visible');
}
function closeMouth() {
  document.getElementById('mouth-closed').setAttribute('visibility','visible');
  document.getElementById('mouth-open').setAttribute('visibility','hidden');
}
function animateMouth(duration) {
  const interval = setInterval(() => {
    openMouth();
    setTimeout(closeMouth, 200 + Math.random()*200);
  }, 400 + Math.random()*200);
  setTimeout(() => { clearInterval(interval); closeMouth(); }, duration);
}

// ── BUBBLE ──
function setBubble(text, typing=false) {
  const el = document.getElementById('bubble');
  if (typing) {
    el.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  } else {
    el.innerHTML = `<span id="bubble-text">${text.slice(0,120)}${text.length>120?'...':''}</span>`;
  }
}

// ── ADD MESSAGE ──
function addMsg(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = role === 'user'
    ? `<div class="msg-avatar">👤</div><div class="msg-bubble">${text}</div>`
    : `<div class="msg-avatar">JAI</div><div class="msg-bubble">${text}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

// ── SPEAK (macOS say) ──
async function speakText(text) {
  try {
    await fetch(API+'/speak', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
  } catch(e) {}
  const duration = text.length * 60;
  animateMouth(duration);
}

// ── SEND MESSAGE ──
async function sendMsg() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text);
  setBubble('', true);
  document.getElementById('status-text').textContent = 'Pensando...';

  try {
    const r = await fetch(API+'/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await r.json();
    const reply = data.reply || 'Sin respuesta';
    addMsg('jai', reply);
    setBubble(reply);
    speakText(reply);
    document.getElementById('status-text').textContent = 'En línea · llama3.2:3b';
  } catch(e) {
    const err = 'Error conectando con JAI. ¿Está el servidor corriendo?';
    addMsg('jai', err);
    setBubble(err);
    document.getElementById('status-text').textContent = 'Sin conexión';
  }
}

// ── MIC ──
function toggleMic() {
  const btn = document.getElementById('btn-mic');
  const wave = document.getElementById('wave');
  const input = document.getElementById('input');

  if (!isRecording) {
    isRecording = true;
    btn.classList.add('recording');
    btn.textContent = '⏹';
    wave.classList.add('active');
    input.placeholder = 'Escuchando...';
    input.disabled = true;

    fetch(API+'/listen', {method:'POST'})
      .then(r=>r.json())
      .then(data => {
        isRecording = false;
        btn.classList.remove('recording');
        btn.textContent = '🎤';
        wave.classList.remove('active');
        input.disabled = false;
        input.placeholder = 'Escribe tu mensaje...';
        if (data.text) {
          input.value = data.text;
          sendMsg();
        }
      })
      .catch(() => {
        isRecording = false;
        btn.classList.remove('recording');
        btn.textContent = '🎤';
        wave.classList.remove('active');
        input.disabled = false;
        input.placeholder = 'Escribe tu mensaje...';
      });
  }
}

// ── INIT ──
window.addEventListener('load', () => {
  document.getElementById('input').focus();
});
</script>
</body>
</html>
